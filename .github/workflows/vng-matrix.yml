name: vng-matrix
# Run the rust-landlock crate suite under virtme-ng/KVM against a MATRIX of
# Landlock ABIs on free ubuntu-24.04 runners:
#   v7 = runner's own kernel (fast baseline)
#   v8 = mainline v7.0 (built with vng)
#   v9 = mainline v7.1 (built with vng)  <-- ABI the current UML CI cannot test
# KVM pins the guest CPU, so this is immune to the UML ptrace-fp flake, and it
# reaches v8/v9 that the UML matrix can't. Fork-only; does NOT touch upstream.
on:
  push:
    branches: [vng-matrix]
  workflow_dispatch:

jobs:
  vng:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: 7, tag: runner }
          - { abi: 8, tag: v7.0 }
          - { abi: 9, tag: v7.1 }
    name: "abi-${{ matrix.abi }}-${{ matrix.tag }}"
    steps:
      - name: Runner CPU
        run: lscpu | grep -iE 'Vendor ID|Model name'

      - name: Enable KVM (udev)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/checkout@v5

      - name: Install vng + kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 build-essential flex bison bc \
            libelf-dev libssl-dev dwarves cpio >/dev/null
          pipx install virtme-ng
          vng --version

      - name: Build crate unit-test binary (host, glibc)
        run: |
          cargo test --no-run --color never 2>&1 | tail -4
          EXEC="$(cargo test --no-run --color never 2>&1 | sed -n 's,^ *Executable unittests src/lib.rs (\(.*\)) *$,\1,p')"
          test -x "$EXEC"
          echo "TEST_BIN=$(realpath "$EXEC")" >> "$GITHUB_ENV"
          echo "test binary: $(realpath "$EXEC")"

      - name: Prepare kernel (${{ matrix.tag }})
        run: |
          set -o pipefail
          if [ "${{ matrix.tag }}" = "runner" ]; then
            KREL="$(uname -r)"
            sudo chmod +r "/boot/vmlinuz-$KREL" "/boot/config-$KREL" 2>/dev/null || true
            echo "KMODE=runner"    >> "$GITHUB_ENV"
            echo "KIMG=/boot/vmlinuz-$KREL" >> "$GITHUB_ENV"
          else
            git clone --depth 1 -b ${{ matrix.tag }} https://github.com/torvalds/linux kern
            # Ensure Landlock is enabled + in the default LSM list, then let vng
            # add its virtme drivers and build.
            printf 'CONFIG_SECURITY=y\nCONFIG_SECURITY_LANDLOCK=y\nCONFIG_LSM="landlock,yama,bpf"\n' > landlock.cfg
            ( cd kern && timeout 2700 vng --build --config ../landlock.cfg --verbose 2>&1 | tail -25 )
            echo "KMODE=built" >> "$GITHUB_ENV"
            echo "KDIR=$PWD/kern" >> "$GITHUB_ENV"
          fi

      - name: Verify guest ABI, then run crate suite under vng/KVM (${{ matrix.tag }} -> abi ${{ matrix.abi }})
        run: |
          set -o pipefail
          run_in_vng() {  # runs "$@" inside the vng guest (hostfs, so host tools work)
            if [ "$KMODE" = "runner" ]; then
              timeout 300 vng --run "$KIMG" -- "$@"
            else
              ( cd "$KDIR" && timeout 300 vng -- "$@" )
            fi
          }
          echo "== guest kernel + Landlock state (proves this is really abi ${{ matrix.abi }}) =="
          run_in_vng sh -c 'echo "uname=$(uname -r)"; echo "lsm=$(cat /sys/kernel/security/lsm)"; python3 -c "import ctypes; print(\"GUEST_LANDLOCK_ABI=\" + str(ctypes.CDLL(None).syscall(444,0,0,1)))"' 2>&1 \
            | grep -E 'uname=|lsm=|GUEST_LANDLOCK_ABI=' | tee guest.info
          echo "== run the crate suite in the guest =="
          run_in_vng "$TEST_BIN" --test-threads=1 2>&1 | tee vng.log | tail -140
          echo "===== VERDICT (target abi ${{ matrix.abi }}) ====="
          GABI="$(sed -n 's/.*GUEST_LANDLOCK_ABI=\([0-9]*\).*/\1/p' guest.info | tail -1)"
          echo "guest reported Landlock ABI: ${GABI:-unknown}"
          grep -qE 'test result: ok' vng.log || { echo "FAIL: tests not ok"; exit 1; }
          if [ "${{ matrix.tag }}" != "runner" ] && [ "${GABI:-0}" != "${{ matrix.abi }}" ]; then
            echo "FAIL: expected guest ABI ${{ matrix.abi }} but got ${GABI:-unknown} (Landlock not active at target ABI)"; exit 1
          fi
          echo "PASS: crate suite GREEN under vng/KVM against ${{ matrix.tag }}, guest Landlock ABI=${GABI}"
